<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CutieCalce</title>
        <!-- THis links my css file-->
         <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator">
            <input type="text" id="display" disabled placeholder="0">

            <div class="buttons">
                <!-- Row 1-->
                 <button class="btn clear">C</button>
                 <button class="btn operator">/</button>
                 <button class="btn operator">*</button>
                 <button class="btn operator">-</button>

                 <!--Row 2-->
                 <button class="btn">7</button>
                 <button class="btn">8</button>
                 <button class="btn">9</button>
                 <button class="btn equals">+</button>

                 <!--Row 3-->
                 <button class="btn">4</button>
                 <button class="btn">5</button>
                 <button class=""btn>6</button>
                 <button class="btn equals">=</button>

                 <!--Row 4-->
                 <button class="btn">3</button>
                 <button class="btn">2</button>
                 <button class="btn">1</button>
                 <button class="btn">0</button>
            </div>
            </div>

            <!--The calculator's "voice"-->
            <p id="status-message" style="margin-top: 20px; font-family: 'Courier New', monoscope; font-size: 18px; color: #333; text-align:center; font-weight: bold;">Ready to do some math!</p>

            <script src="script.js"></script>
    </body>
</html>
